name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@daadefbb2f72b905249bf6201b7dcff911469562
    with:
      coverage_enforce_thresholds: "1"
    secrets: inherit
