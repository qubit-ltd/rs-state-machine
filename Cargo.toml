[package]
name = "qubit-state-machine"
version = "0.6.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-state-machine"
description = "A small, thread-safe finite state machine for Rust"
homepage = "https://github.com/qubit-ltd/rs-state-machine"
documentation = "https://docs.rs/qubit-state-machine"
readme = "README.md"
keywords = ["state-machine", "fsm", "workflow", "thread-safe", "qubit"]
categories = ["data-structures", "concurrency"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/benches/**",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_state_machine"
doctest = true

[features]
default = ["standard", "fast"]
standard = ["dep:qubit-atomic", "dep:qubit-cas"]
fast = ["dep:qubit-fast-cas"]

[dependencies]
thiserror = "2.0"

qubit-atomic = { version = "0.13", optional = true }
qubit-cas = { version = "0.9", path = "../rs-cas", optional = true }
qubit-fast-cas = { version = "0.3", path = "../rs-fast-cas", optional = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "state_machine_benchmarks"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
